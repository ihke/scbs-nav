<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四川办税</title>
<meta name="description" content="四川办税导航 · 电子税务局、财税网址、行政办事一站直达">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<script charset="UTF-8" id="LA_COLLECT" src="//sdk.51.la/js-sdk-pro.min.js"></script>
<script>LA.init({id:"JQzDVEjUBlDAomGx",ck:"JQzDVEjUBlDAomGx"})</script>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --panel-2:#f0f2f5;
    --text:#1a1d21; --text-2:#6b7280; --line:#e5e7eb;
    --accent:#2f6fed; --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.14);
    --radius:16px;
  }
  html[data-theme="dark"]{
    --bg:#0f1115; --panel:#171a20; --panel-2:#1f242c;
    --text:#e8eaed; --text-2:#9aa3ad; --line:#262b33;
    --accent:#5b8cff; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .25s,color .25s;
  }
  .wrap{max-width:1080px;margin:0 0 0 236px;padding:48px 32px 80px}

  /* ===== 左侧导航栏 ===== */
  .sidebar{
    position:fixed;top:0;left:0;width:216px;height:100vh;z-index:50;
    background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:20px 12px 14px;
    transition:background .25s,border-color .25s;
  }
  .sb-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;text-decoration:none;color:inherit}
  .sb-brand img{width:30px;height:30px;border-radius:8px;flex-shrink:0}
  .sb-brand .t{font-size:15px;font-weight:650;letter-spacing:-.2px;line-height:1.2}
  .sb-brand .s{font-size:11px;color:var(--text-2);margin-top:2px}

  .sb-label{font-size:11px;color:var(--text-2);opacity:.7;padding:0 10px 8px;letter-spacing:.4px}

  .sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;margin:0 -4px;padding:0 4px}
  .sb-nav::-webkit-scrollbar{width:5px}
  .sb-nav::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .sb-item{
    display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    border:0;background:transparent;color:var(--text-2);cursor:pointer;
    padding:9px 10px;border-radius:10px;font-size:13.5px;font-family:inherit;
    transition:.16s;margin-bottom:2px;position:relative;
  }
  .sb-item:hover{background:var(--panel-2);color:var(--text)}
  .sb-item.on{
    background:color-mix(in srgb,var(--accent) 10%,var(--panel));
    color:var(--accent);font-weight:600;
  }
  .sb-item.on::before{
    content:"";position:absolute;left:0;top:22%;height:56%;width:3px;
    border-radius:0 3px 3px 0;background:var(--accent);
  }
  .sb-item .si{font-size:15px;line-height:1;flex-shrink:0}
  .sb-item .sn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb-item .sc{font-size:11px;opacity:.55;font-variant-numeric:tabular-nums}

  .sb-foot{border-top:1px solid var(--line);padding-top:10px;margin-top:8px;display:flex;gap:6px}
  .sb-foot .icon-btn{width:36px;height:36px;border-radius:10px;font-size:15px}
  .sb-foot .icon-btn.on{color:var(--accent);border-color:var(--accent)}

  /* 移动端：隐藏侧栏，改用顶部 chips */
  @media(max-width:900px){
    .sidebar{display:none}
    .wrap{margin:0 auto;padding:28px 16px 60px}
  }

  /* 顶部 */
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:32px}
  .brand h1{margin:0;font-size:26px;font-weight:650;letter-spacing:-.3px}
  .brand p{margin:6px 0 0;color:var(--text-2);font-size:14px}
  .tools{display:flex;gap:8px;flex-shrink:0}
  .icon-btn{
    width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);cursor:pointer;font-size:17px;
    display:flex;align-items:center;justify-content:center;transition:.18s;
  }
  .icon-btn:hover{border-color:var(--accent);color:var(--accent)}

  /* 搜索框 */
  .search{
    display:flex;align-items:center;gap:10px;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:4px 6px 4px 14px;
    margin-bottom:36px;box-shadow:var(--shadow);transition:.18s;
  }
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
  .search .mag{color:var(--text-2);font-size:16px}
  .search input{
    flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);
    font-size:15px;padding:12px 0;font-family:inherit;
  }
  .search input::placeholder{color:var(--text-2)}
  .search select{
    border:0;outline:0;background:var(--panel-2);color:var(--text-2);
    border-radius:10px;padding:9px 10px;font-size:13px;cursor:pointer;font-family:inherit;
  }
  .search button{
    border:0;border-radius:10px;background:var(--accent);color:#fff;
    padding:10px 18px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:.18s;
  }
  .search button:hover{filter:brightness(1.08)}

  /* 分组快捷跳转 */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .chip{
    border:1px solid var(--line);background:var(--panel);color:var(--text-2);
    border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.18s;white-space:nowrap;
  }
  .chip:hover,.chip.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
  .chips.hide{display:none}
  @media(min-width:901px){.chips{display:none}}

  /* 分组 */
  .group{margin-bottom:30px;animation:rise .4s both;scroll-margin-top:16px}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .group-head{display:flex;align-items:center;gap:8px;margin-bottom:14px;cursor:pointer;user-select:none;width:fit-content}
  .group-head .gi{font-size:16px;line-height:1}
  .group-head h2{margin:0;font-size:14px;font-weight:600;letter-spacing:.2px;color:var(--text-2)}
  .group-head .cnt{font-size:12px;color:var(--text-2);opacity:.6}
  .group-head .arrow{margin-left:2px;font-size:10px;color:var(--text-2);opacity:.55;transition:transform .2s}
  .group.collapsed .arrow{transform:rotate(-90deg)}
  .group.collapsed .grid{display:none}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .card{
    display:flex;align-items:center;gap:11px;padding:12px 14px;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    text-decoration:none;color:inherit;transition:.18s;position:relative;overflow:hidden;
  }
  .card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
  .card:active{transform:none}
  .ico{
    width:32px;height:32px;border-radius:9px;flex-shrink:0;background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;font-size:16px;overflow:hidden;
  }
  .ico img{width:100%;height:100%;object-fit:contain}
  .meta{min-width:0}
  .meta .n{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .d{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

  .empty{text-align:center;color:var(--text-2);padding:60px 0;font-size:14px;display:none}

  footer{text-align:center;color:var(--text-2);font-size:12px;margin-top:50px;opacity:.7}

  @media(max-width:560px){
    .wrap{padding:28px 14px 60px}
    .brand h1{font-size:22px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
    .card{padding:10px 11px;gap:9px}
    .search select{display:none}
    .chips{gap:6px}
    .chip{padding:6px 11px;font-size:12px}
  }
</style>
</head>
<body>
<aside class="sidebar">
  <a class="sb-brand" href="/">
    <img src="favicon.png" alt="">
    <div>
      <div class="t" id="sbTitle">四川办税</div>
      <div class="s" id="sbSub">财税导航</div>
    </div>
  </a>
  <div class="sb-label">全部分组</div>
  <nav class="sb-nav" id="sbNav"></nav>
  <div class="sb-foot">
    <span id="sbTotal" style="font-size:11px;color:var(--text-2)"></span>
  </div>
</aside>

<div class="wrap">
  <header>
    <div class="brand">
      <h1 id="title">四川办税</h1>
      <p id="subtitle">电子税务局 · 财税网址 · 行政办事 一站直达</p>
    </div>
    <div class="tools">
      <button class="icon-btn" id="foldBtn" title="全部折叠/展开">⇕</button>
      <button class="icon-btn" id="themeBtn" title="切换深浅色">🌙</button>
    </div>
  </header>

  <nav class="chips" id="chips"></nav>

  <form class="search" id="searchForm">
    <span class="mag">🔍</span>
    <input id="q" type="text" placeholder="搜站点名，或直接输入网址" autocomplete="off" spellcheck="false">
    <select id="engine"></select>
    <button type="submit">搜索</button>
  </form>

  <main id="list"></main>
  <div class="empty" id="empty">没有匹配的站点</div>

  <footer>由 Cloudflare Pages 驱动</footer>
</div>

<script src="data.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const root = document.documentElement;

  /* ---------- 标题 ---------- */
  document.title = SITE.title;
  $('#title').textContent = SITE.title;
  $('#subtitle').textContent = SITE.subtitle;
  $('#sbTitle').textContent = SITE.title;
  $('#sbSub').textContent = '财税导航';
  $('#sbTotal').textContent = '共 ' + GROUPS.reduce((n, g) => n + g.items.length, 0) + ' 个站点';

  /* ---------- 深浅色：跟随系统 + 手动记忆 ---------- */
  const saved = localStorage.getItem('nav-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  setTheme(saved || (prefersDark ? 'dark' : 'light'));

  function setTheme(t) {
    root.dataset.theme = t;
    $('#themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('nav-theme', t);
  }
  $('#themeBtn').onclick = () =>
    setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');

  /* ---------- 图标懒加载（自动抓 favicon） ---------- */
  function favicon(url) {
    try {
      const host = new URL(url).hostname;
      return 'https://icons.duckduckgo.com/ip3/' + host + '.ico';
    } catch (e) { return ''; }
  }

  /* ---------- 渲染卡片 ---------- */
  const list = $('#list');
  const chips = $('#chips');
  const sbNav = $('#sbNav');
  const frag = document.createDocumentFragment();
  const sbItems = [];

  /* 统一跳转 + 高亮（侧栏与 chips 共用） */
  function activate(gi, smooth) {
    const sec = document.getElementById('g' + gi);
    if (!sec) return;
    sec.classList.remove('collapsed');
    sec.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
    sbItems.forEach((el, i) => el.classList.toggle('on', i === gi));
    document.querySelectorAll('.chip').forEach((c, i) => c.classList.toggle('on', i === gi));
  }

  GROUPS.forEach((g, gi) => {
    const sec = document.createElement('section');
    sec.className = 'group';
    sec.id = 'g' + gi;
    sec.style.animationDelay = (gi * 40) + 'ms';

    const head = document.createElement('div');
    head.className = 'group-head';
    head.title = '点击折叠 / 展开';
    head.innerHTML =
      '<span class="gi">' + (g.icon || '📁') + '</span>' +
      '<h2></h2><span class="cnt">' + g.items.length + '</span>' +
      '<span class="arrow">▼</span>';
    head.querySelector('h2').textContent = g.name;
    head.addEventListener('click', () => sec.classList.toggle('collapsed'));
    sec.appendChild(head);

    /* 左侧导航项 */
    const sb = document.createElement('button');
    sb.type = 'button';
    sb.className = 'sb-item';
    sb.innerHTML = '<span class="si"></span><span class="sn"></span><span class="sc"></span>';
    sb.querySelector('.si').textContent = g.icon || '📁';
    sb.querySelector('.sn').textContent = g.name;
    sb.querySelector('.sc').textContent = g.items.length;
    sb.onclick = () => activate(gi, true);
    sbNav.appendChild(sb);
    sbItems.push(sb);

    /* 移动端顶部快捷跳转 */
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.textContent = g.name;
    chip.onclick = () => activate(gi, true);
    chips.appendChild(chip);

    const grid = document.createElement('div');
    grid.className = 'grid';

    g.items.forEach((it) => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = it.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.dataset.search = (it.name + ' ' + (it.desc || '') + ' ' + g.name).toLowerCase();

      const ico = document.createElement('div');
      ico.className = 'ico';
      const src = it.icon || favicon(it.url);
      const isImg = !!src && (/^(https?:)?\/\//.test(src) || /\.(png|jpe?g|svg|gif|webp|ico)$/i.test(src));
      if (isImg) {
        const img = document.createElement('img');
        img.alt = '';
        img.loading = 'lazy';
        img.src = src;
        img.onerror = () => { ico.textContent = (it.name || '?').charAt(0).toUpperCase(); img.remove(); };
        ico.appendChild(img);
      } else {
        ico.textContent = it.icon || (it.name || '?').charAt(0).toUpperCase();
      }

      const meta = document.createElement('div');
      meta.className = 'meta';
      const n = document.createElement('div');
      n.className = 'n'; n.textContent = it.name;
      const d = document.createElement('div');
      d.className = 'd'; d.textContent = it.desc || new URL(it.url).hostname;
      meta.append(n, d);

      a.append(ico, meta);
      grid.appendChild(a);
    });

    sec.appendChild(grid);
    frag.appendChild(sec);
  });
  list.appendChild(frag);

  /* ---------- 滚动高亮：当前分组自动点亮侧栏 ---------- */
  const secs = [...document.querySelectorAll('.group')];
  let lockSpy = 0;
  const spy = new IntersectionObserver((entries) => {
    if (Date.now() < lockSpy) return;
    const vis = entries.filter((e) => e.isIntersecting);
    if (!vis.length) return;
    const top = vis.sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
    const gi = Number(top.target.id.slice(1));
    sbItems.forEach((el, i) => el.classList.toggle('on', i === gi));
    document.querySelectorAll('.chip').forEach((c, i) => c.classList.toggle('on', i === gi));
    // 侧栏当前项滚入可视区
    const active = sbItems[gi];
    if (active && sbNav.scrollHeight > sbNav.clientHeight) {
      const r = active.getBoundingClientRect(), nr = sbNav.getBoundingClientRect();
      if (r.top < nr.top + 8 || r.bottom > nr.bottom - 8) {
        active.scrollIntoView({ block: 'nearest' });
      }
    }
  }, { rootMargin: '-10% 0px -70% 0px', threshold: 0 });
  secs.forEach((s) => spy.observe(s));

  // 点击跳转后短暂锁定，避免滚动过程中高亮乱跳
  document.addEventListener('click', (e) => {
    if (e.target.closest('.sb-item, .chip')) lockSpy = Date.now() + 700;
  }, true);

  /* ---------- 一键全部折叠 / 展开 ---------- */
  let allFolded = false;
  $('#foldBtn').onclick = () => {
    allFolded = !allFolded;
    document.querySelectorAll('.group').forEach((s) => s.classList.toggle('collapsed', allFolded));
    $('#foldBtn').style.color = allFolded ? 'var(--accent)' : '';
  };

  /* ---------- 本地过滤（输入即筛站点） ---------- */
  const q = $('#q');
  q.addEventListener('input', () => {
    const kw = q.value.trim().toLowerCase();
    let total = 0;
    document.querySelectorAll('.group').forEach((sec) => {
      let shown = 0;
      // 搜索时强制展开，避免结果被折叠藏住
      if (kw) sec.classList.remove('collapsed');
      sec.querySelectorAll('.card').forEach((c) => {
        const hit = !kw || c.dataset.search.includes(kw);
        c.style.display = hit ? '' : 'none';
        if (hit) shown++;
      });
      sec.style.display = shown ? '' : 'none';
      const cnt = sec.querySelector('.cnt');
      if (cnt) cnt.textContent = shown;
      total += shown;
    });
    chips.classList.toggle('hide', !!kw);
    $('#empty').style.display = total ? 'none' : 'block';
  });

  /* ---------- 搜索 ---------- */
  const sel = $('#engine');
  ENGINES.forEach((e, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = e.name;
    sel.appendChild(o);
  });
  const lastEngine = localStorage.getItem('nav-engine');
  if (lastEngine && ENGINES[lastEngine]) sel.value = lastEngine;
  sel.onchange = () => localStorage.setItem('nav-engine', sel.value);

  function go() {
    const v = q.value.trim();
    if (!v) return;
    // 输入的是网址就直接跳转，否则交给搜索引擎
    const isUrl = /^https?:\/\//i.test(v) || (/^[\w-]+(\.[\w-]+)+([\/?#].*)?$/.test(v) && !/\s/.test(v));
    if (isUrl) {
      location.href = /^https?:\/\//i.test(v) ? v : 'https://' + v;
      return;
    }
    const base = ENGINES[sel.value] ? ENGINES[sel.value].url : ENGINES[0].url;
    location.href = base + encodeURIComponent(v);
  }
  $('#searchForm').addEventListener('submit', (e) => { e.preventDefault(); go(); });

  /* ---------- 快捷键：/ 或 Ctrl+K 聚焦搜索 ---------- */
  document.addEventListener('keydown', (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if ((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) {
      e.preventDefault();
      q.focus();
      q.select();
    }
    if (e.key === 'Escape') { q.blur(); }
  });
})();
</script>
</body>
</html>
